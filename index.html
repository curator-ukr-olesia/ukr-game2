<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Літературний Tinder: фінал</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#1E1038; --panel:#2D1A55; --violet:#A35AE8; --lilac:#C38AF0; --ink:#F6F0FA; --soft:#CDBDE6; --gold:#F2B33D; --rose:#E85D9A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px);
  color-scheme:dark;
}
*, *::before, *::after { box-sizing:inherit }
html, body { margin:0; min-height:100% }
body {
  font-family:'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  background:radial-gradient(120% 80% at 50% 0%, #3A2273 0%, var(--bg) 60%) fixed, var(--bg);
  color:var(--ink);
  display:flex; flex-direction:column; align-items:center;
  padding:clamp(12px, 3vw, 32px) env(safe-area-inset-right, 0px) 24px env(safe-area-inset-left, 0px);
  -webkit-tap-highlight-color:transparent;
}
header { width:var(--pw); margin:0 auto clamp(10px, 2vw, 20px); display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap }
header h1 { margin:0; font-size:clamp(22px, 3.4vw, 34px); font-weight:800; line-height:1.15 }
header p { margin:0; color:var(--soft); font-size:clamp(14px, 1.6vw, 17px) }

/* The player's width: as wide as fits, never taller than the screen. */
body { --pw:min(calc(100vw - 24px), 1280px, calc((100vh - 230px) * 16 / 9)) }
@supports (height:100dvh) { body { --pw:min(calc(100vw - 24px), 1280px, calc((100dvh - 230px) * 16 / 9)) } }
@media (max-width:700px) and (orientation:portrait) { body { --pw:calc(100vw - 16px) } }
@media (max-height:520px) and (orientation:landscape) {
  header { display:none }
  body { padding-top:6px; --pw:min(calc(100vw - 16px), calc((100vh - 64px) * 16 / 9)) }
  @supports (height:100dvh) { body { --pw:min(calc(100vw - 16px), calc((100dvh - 64px) * 16 / 9)) } }
}

.player { width:var(--pw); display:flex; flex-direction:column; gap:10px }
.screen { position:relative; width:100%; aspect-ratio:16 / 9; border-radius:clamp(10px, 1.6vw, 22px); overflow:hidden; background:#2D1A55; box-shadow:0 20px 60px rgba(0,0,0,.45); cursor:pointer; touch-action:manipulation }
#stage { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; overflow:hidden }
.scene { position:absolute; inset:0; display:none }
.scene.on { display:block }

.big-play { position:absolute; inset:0; margin:auto; width:clamp(64px, 12vw, 112px); height:clamp(64px, 12vw, 112px); border-radius:50%; border:0; background:rgba(246,240,250,.92); color:#2D1A55; display:none; place-items:center; cursor:pointer; box-shadow:0 10px 30px rgba(0,0,0,.4) }
.big-play svg { width:42%; height:42%; margin-left:6% }
.big-play.replay svg { margin-left:0 }
.paused .big-play { display:grid }

.bar { display:flex; align-items:center; gap:clamp(6px, 1.4vw, 14px); background:rgba(45,26,85,.85); border-radius:16px; padding:8px clamp(8px, 1.4vw, 14px) }
.btn { flex:none; width:44px; height:44px; border-radius:12px; border:0; background:transparent; color:var(--ink); display:grid; place-items:center; cursor:pointer }
.btn:hover { background:rgba(246,240,250,.1) }
.btn svg { width:24px; height:24px }
.btn:focus-visible, .chap:focus-visible, .big-play:focus-visible, input[type=range]:focus-visible { outline:3px solid var(--gold); outline-offset:2px }
.time { flex:none; font-variant-numeric:tabular-nums; font-size:15px; color:var(--soft); min-width:7.5ch; text-align:center }
.seek { flex:1; min-width:60px; height:44px; -webkit-appearance:none; appearance:none; background:transparent; cursor:pointer }
.seek::-webkit-slider-runnable-track { height:6px; border-radius:3px; background:linear-gradient(90deg, var(--gold) var(--p, 0%), rgba(246,240,250,.25) var(--p, 0%)) }
.seek::-moz-range-track { height:6px; border-radius:3px; background:rgba(246,240,250,.25) }
.seek::-moz-range-progress { height:6px; border-radius:3px; background:var(--gold) }
.seek::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; margin-top:-6px; border-radius:50%; background:var(--ink); border:0 }
.seek::-moz-range-thumb { width:18px; height:18px; border-radius:50%; background:var(--ink); border:0 }

.chapters { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding:2px }
.chapters::-webkit-scrollbar { display:none }
.chap { flex:none; min-height:40px; padding:8px 16px; border-radius:999px; border:1.5px solid rgba(246,240,250,.25); background:transparent; color:var(--soft); font:inherit; font-size:15px; cursor:pointer; white-space:nowrap }
.chap.on { background:var(--ink); color:#2D1A55; border-color:var(--ink); font-weight:700 }

.caption { display:none; background:rgba(45,26,85,.85); border-radius:16px; padding:14px 18px; min-height:76px }
.caption b { display:block; font-size:19px; line-height:1.25 }
.caption span { display:block; margin-top:4px; color:var(--soft); font-size:15px; line-height:1.35 }
/* On a narrow screen the in-film captions get too small, so they move under the film. */
@media (max-width:760px) {
  .caption { display:block }
  .time { display:none }
}
@media (max-height:520px) and (orientation:landscape) { .caption, .chapters { display:none } }

/* Fullscreen, real or (on iPhone) pretended. */
.player:fullscreen, .player.fs { width:100vw; height:100vh; background:#000; justify-content:center; align-items:center; padding:8px; gap:6px }
.player.fs { position:fixed; inset:0; z-index:10; height:100%; padding:calc(env(safe-area-inset-top, 0px) + 8px) 8px calc(env(safe-area-inset-bottom, 0px) + 8px) }
.player:fullscreen .screen, .player.fs .screen { width:min(100%, calc((100vh - 80px) * 16 / 9)); border-radius:0 }
.player:fullscreen .bar, .player.fs .bar { width:min(100%, 1100px) }
.player:fullscreen .chapters, .player:fullscreen .caption, .player.fs .chapters, .player.fs .caption { display:none }

@media (prefers-reduced-motion:reduce) { .btn, .chap { transition:none } }

/* ---------- the film's own styles ---------- */
#stage { --ground:#2D1A55; --main:#A35AE8; --second:#F6F0FA; --accent:#F2B33D; color:var(--second); font-family:'Onest', system-ui, sans-serif;
  --night:color-mix(in srgb, var(--ground) 80%, black); --dusk:color-mix(in srgb, var(--main) 55%, var(--ground)); --haze:color-mix(in srgb, var(--main) 35%, var(--second)); --rock:color-mix(in srgb, var(--ground) 70%, var(--main)); --rockfar:color-mix(in srgb, var(--ground) 45%, var(--main));
  --glow:color-mix(in srgb, var(--accent) 80%, var(--second)); --ember:color-mix(in srgb, var(--accent) 60%, #C8324F); --wood:color-mix(in srgb, var(--accent) 30%, var(--ground)); --woodlit:color-mix(in srgb, var(--accent) 55%, var(--ground)); --shade:rgba(0,0,0,.28) }
#stage .ground { position:absolute; inset:0; background:var(--ground) }
#stage .words { position:absolute; margin:0; display:flex; flex-direction:column; gap:14px }
#stage .words > * { margin:0 }
#stage .line { font-size:96px; line-height:1.05; font-weight:800 }
#stage .sub { font-size:38px; font-weight:400 }
#stage .art { position:absolute; inset:0; width:100%; height:100%; overflow:visible }
#stage .edge { position:absolute; inset:0; background:radial-gradient(95% 85% at 50% 50%, transparent 55%, color-mix(in srgb, var(--night) 55%, transparent)) }
#stage .cap { padding:26px 34px 28px; border-radius:28px; background:color-mix(in srgb, var(--night) 78%, transparent); max-width:900px }
#stage .cap .nm { font-size:52px; font-weight:800; line-height:1.1 }
#stage .cap .wk { font-size:32px; color:color-mix(in srgb, var(--second) 80%, var(--main)) }
@media (max-width:760px) { #stage .words.cap { display:none } }
#stage .pool { position:absolute; border-radius:50%; background:radial-gradient(closest-side, color-mix(in srgb, var(--glow) 55%, transparent), transparent) }
</style>
</head>
<body>
<header>
  <h1>Літературний Tinder: фінал</h1>
  <p>від бадді Карини та кураторки Олесі</p>
</header>

<main class="player paused" id="player">
  <div class="screen" id="screen" role="region" aria-label="Анімація: три пари героїв української літератури">
    <div id="stage"></div>
    <button class="big-play" id="bigPlay" aria-label="Відтворити"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg></button>
  </div>
  <div class="bar">
    <button class="btn" id="play" aria-label="Пауза"></button>
    <input class="seek" id="seek" type="range" min="0" max="28" step="0.01" value="0" aria-label="Перемотати">
    <span class="time" id="time">0:00 / 0:28</span>
    <button class="btn" id="sound" aria-label="Увімкнути звук" aria-pressed="false"></button>
    <button class="btn" id="full" aria-label="На весь екран"></button>
  </div>
  <nav class="chapters" id="chapters" aria-label="Сцени"></nav>
  <div class="caption" id="caption" aria-live="polite"></div>
</main>

<script>
(function () {
'use strict';
/* ---------- tiny animation kit ---------- */
const clamp01 = (x) => x < 0 ? 0 : x > 1 ? 1 : x;
const kit = {
  clamp01,
  seg: (t, a, b) => clamp01((t - a) / (b - a)),
  lerp: (a, b, p) => a + (b - a) * p,
  eo: (x) => { x = clamp01(x); return 1 - Math.pow(1 - x, 3); },
  ei: (x) => { x = clamp01(x); return x * x * x; },
  eio: (x) => { x = clamp01(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; },
  eob: (x, s) => { x = clamp01(x); s = s == null ? 1.4 : s; const y = x - 1; return 1 + (s + 1) * y * y * y + s * y * y; },
  rng(seed) { let a = (seed * 2654435761) >>> 0 || 1; return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
  defs: [],
  scene(id, def) { kit.defs.push({ id, def }); }
};
function sceneKit(container) {
  return Object.assign({}, kit, {
    stage: container, W: 1920, H: 1080,
    h(html) { const tp = document.createElement('template'); tp.innerHTML = html.trim(); return tp.content.firstElementChild; },
    css(text) { const s = document.createElement('style'); s.textContent = text; document.head.appendChild(s); }
  });
}

/* ---------- the six heroes, drawn exactly as in the game ---------- */
(function () {
  const P = {
    maksym: {name:'Максим Беркут', av:{bg:['#4E2491','#A35AE8'],scene:'mountains',skin:'#EDBE98',hair:'#4A2C1E',hs:'long',hw:'band',brows:'soft',mouth:'smile',vest:'#7A4A2A',fur:true}},
    halia: {name:'Галя Ґудзь', av:{bg:['#7D3BC9','#E7A6E0'],scene:'field',skin:'#F5D0B5',hair:'#6B3D22',hs:'braid',hw:'wreath',brows:'sad',mouth:'soft',fem:true}},
    karpo: {name:'Карпо Кайдаш', av:{bg:['#4B2C8C','#9B6AE0'],scene:'wheel',skin:'#E2AE86',hair:'#2E1E16',hs:'short',hw:'hat',brows:'frown',mouth:'flat',must:'short',vest:'#3B2A4A'}},
    myroslava: {name:'Мирослава Вовк', av:{bg:['#3A2273','#8A4BD6'],scene:'forest',skin:'#F0C9A8',hair:'#2A1A14',hs:'loose',hw:'none',brows:'soft',mouth:'smirk',fem:true,bow:true}},
    chipka: {name:'Чіпка Варениченко', av:{bg:['#2D1A55','#C4579A'],scene:'steppe',skin:'#DDA57E',hair:'#1E1512',hs:'short',hw:'kucma',brows:'frown',mouth:'flat',must:'long',vest:'#5A2340'}},
    motria: {name:'Мотря Довбуш', av:{bg:['#6A2DB8','#C38AF0'],scene:'pear',skin:'#F0C2A0',hw:'khustka',hwc:'#C8324F',brows:'soft',mouth:'smirk',fem:true}}
  };
  function tree(x,y,h,o){return '<path d="M'+x+' '+(y-h)+' L'+(x-h*.38)+' '+y+' L'+(x+h*.38)+' '+y+'Z" fill="#1E0F3D" opacity="'+o+'"/>'}
  function pear(x,y){return '<path d="M'+x+' '+y+' q-4 6 -4 11 a6 6 0 0 0 12 0 q0 -5 -4 -11z" fill="#E8D25A"/>'}
  function diamond(x,y,r,c){return '<path d="M'+x+' '+(y-r)+' L'+(x+r)+' '+y+' L'+x+' '+(y+r)+' L'+(x-r)+' '+y+'Z" fill="'+c+'"/>'}
  const SCENES = {
    mountains:'<path d="M0 140 L38 92 L62 118 L104 62 L142 112 L168 90 L200 118 V200 H0Z" fill="#fff" opacity=".16"/><path d="M104 62 L92 78 L100 75 L108 82 L116 76Z" fill="#fff" opacity=".55"/><path d="M0 165 L50 128 L90 150 L140 122 L200 158 V200 H0Z" fill="#2A1450" opacity=".35"/>',
    field:'<circle cx="160" cy="42" r="18" fill="#FFE7A8" opacity=".8"/><path d="M0 150 Q55 128 105 142 T200 136 V200 H0Z" fill="#fff" opacity=".2"/>'+[[18,150],[34,158],[172,146],[188,156],[152,158],[10,165]].map(function(p){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.2" fill="#FFD6F2"/>'}).join(''),
    wheel:(function(){var s='<g opacity=".3" stroke="#fff" fill="none"><circle cx="158" cy="56" r="34" stroke-width="7"/><circle cx="158" cy="56" r="7" stroke-width="5"/>';for(var i=0;i<8;i++){var a=i*Math.PI/4;s+='<line x1="158" y1="56" x2="'+(158+34*Math.cos(a)).toFixed(1)+'" y2="'+(56+34*Math.sin(a)).toFixed(1)+'" stroke-width="3"/>'}return s+'</g><path d="M0 160 H200 V200 H0Z" fill="#fff" opacity=".1"/>'})(),
    forest:'<circle cx="38" cy="36" r="11" fill="#fff" opacity=".5"/>'+tree(18,152,72,.5)+tree(48,140,52,.35)+tree(135,138,44,.3)+tree(162,146,66,.45)+tree(190,154,78,.55),
    steppe:'<circle cx="150" cy="126" r="34" fill="#FFB36B" opacity=".6"/><path d="M0 140 Q100 128 200 140 V200 H0Z" fill="#1A0D33" opacity=".45"/>'+[12,22,32].map(function(x,i){return '<path d="M'+x+' 186 Q'+(x+2)+' 160 '+(x+4)+' '+(140+i*4)+'" stroke="#F7C873" stroke-width="2" fill="none"/><ellipse cx="'+(x+4)+'" cy="'+(138+i*4)+'" rx="3" ry="8" fill="#F7C873"/>'}).join(''),
    pear:'<rect x="160" y="70" width="10" height="90" rx="4" fill="#3B2049" opacity=".55"/><circle cx="165" cy="56" r="38" fill="#4C9A5A" opacity=".6"/><circle cx="138" cy="72" r="22" fill="#4C9A5A" opacity=".5"/>'+pear(152,48)+pear(178,62)+pear(138,70)+pear(170,32)
  };
  function parts(o) {
    var hair=o.hair||'#2A1A14', sk=o.skin, b='', s='', h='';
    if(o.hs==='long') b+='<path d="M66 92 Q62 52 100 52 Q138 52 134 92 L140 148 Q122 142 116 122 L84 122 Q78 142 60 148Z" fill="'+hair+'"/>';
    if(o.hs==='loose') b+='<path d="M64 94 Q58 48 100 48 Q142 48 136 94 L146 176 Q124 168 118 132 L82 132 Q76 168 54 176Z" fill="'+hair+'"/>';
    if(o.hw==='khustka') b+='<path d="M66 108 L48 168 L84 152Z" fill="'+o.hwc+'"/><path d="M134 108 L152 168 L116 152Z" fill="'+o.hwc+'"/>';
    if(o.hw==='wreath') b+=[['#C8324F',72,52],['#F2B33D',76,60],['#8E44D6',80,68]].map(function(r){return '<path d="M'+r[1]+' 80 Q'+(r[1]-10)+' 130 '+r[2]+' 190" stroke="'+r[0]+'" stroke-width="5" fill="none"/>'}).join('');
    if(o.bow) b+='<path d="M148 102 Q194 150 152 198" stroke="#8A5A32" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M148 102 L152 198" stroke="#EFE3CF" stroke-width="1.3"/>';
    s+='<path d="M36 200 C38 166 62 150 100 148 C138 150 162 166 164 200Z" fill="#F6F0FA"/>';
    for(var y=158;y<200;y+=10) s+=diamond(100,y,4,'#C8324F');
    if(o.fem){ s+=diamond(58,178,6,'#C8324F')+diamond(142,178,6,'#C8324F')+diamond(58,178,2.5,'#2A1A2E')+diamond(142,178,2.5,'#2A1A2E'); }
    if(o.vest){
      s+='<path d="M36 200 C38 166 62 150 84 149 L90 200Z" fill="'+o.vest+'"/><path d="M164 200 C162 166 138 150 116 149 L110 200Z" fill="'+o.vest+'"/>';
      if(o.fur) s+='<path d="M84 149 L90 200 M116 149 L110 200" stroke="#F3E9DA" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 5"/>';
    }
    s+='<path d="M87 116 L87 146 Q100 156 113 146 L113 116Z" fill="'+sk+'"/><path d="M87 124 Q100 136 113 124 L113 118 L87 118Z" fill="#000" opacity=".08"/>';
    if(o.fem){ for(var i=0;i<=8;i++){var t=i/8;s+='<circle cx="'+(82+36*t).toFixed(1)+'" cy="'+(150+10*Math.sin(Math.PI*t)).toFixed(1)+'" r="3.4" fill="'+(i%2?'#F2B33D':'#C8324F')+'"/>'} }
    h+='<ellipse cx="71" cy="98" rx="5" ry="8" fill="'+sk+'"/><ellipse cx="129" cy="98" rx="5" ry="8" fill="'+sk+'"/>';
    h+='<ellipse cx="100" cy="94" rx="29" ry="35" fill="'+sk+'"/>';
    if(o.fem) h+='<circle cx="84" cy="108" r="6" fill="#E46A8A" opacity=".3"/><circle cx="116" cy="108" r="6" fill="#E46A8A" opacity=".3"/>';
    h+='<g class="eyes"><ellipse cx="89" cy="97" rx="3.2" ry="3.8" fill="#24172E"/><ellipse cx="111" cy="97" rx="3.2" ry="3.8" fill="#24172E"/><circle cx="90.2" cy="95.6" r="1" fill="#fff"/><circle cx="112.2" cy="95.6" r="1" fill="#fff"/></g>';
    if(o.fem) h+='<path d="M85 94 L82 92 M115 94 L118 92" stroke="#24172E" stroke-width="1.5" stroke-linecap="round"/>';

    if(o.hs==='short'||o.hs==='long') h+='<path d="M70 92 Q66 56 100 55 Q134 56 130 92 Q126 74 112 70 Q100 76 86 71 Q74 76 70 92Z" fill="'+hair+'"/>';

    if(o.hs==='braid'){
      h+='<path d="M70 98 Q66 58 100 58 Q134 58 130 98 Q126 72 100 64 Q74 72 70 98Z" fill="'+hair+'"/>';
      for(var k=0;k<7;k++) h+='<ellipse cx="'+(127+k*2.4).toFixed(1)+'" cy="'+(110+k*11)+'" rx="7" ry="7.5" transform="rotate('+(k%2?20:-20)+' '+(127+k*2.4).toFixed(1)+' '+(110+k*11)+')" fill="'+hair+'" stroke="rgba(0,0,0,.25)" stroke-width="1"/>';
      h+='<path d="M138 186 l-9 -6 v12z M144 186 l9 -6 v12z" fill="#C8324F"/>';
    }
    if(o.hw==='khustka'){
      h+='<path d="M64 112 Q56 46 100 46 Q144 46 136 112 Q132 78 100 72 Q68 78 64 112Z" fill="'+o.hwc+'"/>';
      [[100,57],[84,61],[116,61],[74,79],[126,79],[69,97],[131,97]].forEach(function(p){h+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.6" fill="#FFE3EC"/>'});
    }
    if(o.hw==='wreath'){
      var fx=[70,79,90,100,110,121,130], fy=[82,68,59,56,59,68,82], fc=['#C8324F','#F2B33D','#8E44D6','#E85D9A'];
      for(var j=0;j<6;j++) h+='<ellipse cx="'+((fx[j]+fx[j+1])/2)+'" cy="'+((fy[j]+fy[j+1])/2-3)+'" rx="5" ry="3" fill="#3E8E4E"/>';
      for(var f=0;f<7;f++) h+='<circle cx="'+fx[f]+'" cy="'+fy[f]+'" r="7.5" fill="'+fc[f%4]+'"/><circle cx="'+fx[f]+'" cy="'+fy[f]+'" r="2.5" fill="#FFF3C4"/>';

  if (player.classList.contains('fs')) { player.classList.remove('fs'); document.body.style.overflow = ''; fit(); ui(); return; }
  if (player.requestFullscreen) player.requestFullscreen().catch(() => { player.classList.add('fs'); document.body.style.overflow = 'hidden'; fit(); ui(); });
  else if (player.webkitRequestFullscreen) player.webkitRequestFullscreen();
  else { player.classList.add('fs'); document.body.style.overflow = 'hidden'; fit(); ui(); }
});
document.addEventListener('fullscreenchange', () => { fit(); ui(); });
document.addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('button, input')) return;
  if (e.key === ' ' || e.key === 'k') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowRight') goTo(t + 2);
  else if (e.key === 'ArrowLeft') goTo(t - 2);
  else if (e.key === 'Escape' && player.classList.contains('fs')) { player.classList.remove('fs'); document.body.style.overflow = ''; fit(); ui(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && playing) pause(); });

function fit() { const w = screen.clientWidth; stage.style.transform = 'scale(' + (w / 1920) + ')'; }
if (window.ResizeObserver) new ResizeObserver(fit).observe(screen); else window.addEventListener('resize', fit);
fit();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
draw(); ui();
play();
})();
</script>
</body>
</html>
